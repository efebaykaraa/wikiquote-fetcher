[package]
name = "wikiquote-fetcher"
version = "1.1.0"
edition = "2024"
description = "Fetch quotes from Wikiquote, translate them, and manage reusable quote pools"
license = "GPL-3.0-or-later"
repository = "https://github.com/efebaykaraa/wikiquote-fetcher"
homepage = "https://github.com/efebaykaraa/wikiquote-fetcher"
documentation = "https://docs.rs/wikiquote-fetcher"
readme = "README.md"
keywords = ["wikiquote", "quotes", "translation", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
anyhow = "1.0"
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", features = ["json"] }
